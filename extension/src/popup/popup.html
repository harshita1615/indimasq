<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IndiMasq</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" width="28" height="28" alt="" />
      <div>
        <h1>IndiMasq</h1>
        <p class="muted" data-i18n="popup_tagline"></p>
      </div>
    </header>

    <section id="chat" hidden>
      <h2 data-i18n="popup_chat"></h2>
      <ul id="chat-list" class="list finds"></ul>
      <p class="muted" data-i18n="popup_chat_hint"></p>
    </section>

    <section>
      <h2 data-i18n="popup_sites"></h2>
      <ul id="sites" class="list"></ul>
    </section>

    <section>
      <h2 data-i18n="popup_files"></h2>
      <ul class="list">
        <li>
          <span id="files-label" data-i18n="popup_files_check"></span>
          <label class="switch">
            <input id="files" type="checkbox" aria-labelledby="files-label" />
            <span></span>
          </label>
        </li>
      </ul>
      <p class="muted" data-i18n="popup_files_hint"></p>
    </section>

    <section>
      <h2 data-i18n="popup_replies"></h2>
      <ul class="list">
        <li>
          <span id="restore-label" data-i18n="popup_restore"></span>
          <label class="switch">
            <input id="restore" type="checkbox" aria-labelledby="restore-label" />
            <span></span>
          </label>
        </li>
      </ul>
      <p class="muted" data-i18n="popup_restore_hint"></p>
    </section>

    <section>
      <h2 data-i18n="popup_caught"></h2>
      <ul id="caught" class="list"></ul>
      <p id="none" class="muted" data-i18n="popup_none_caught" hidden></p>
      <button id="reset" type="button" class="link" data-i18n="popup_reset" hidden></button>
    </section>

    <footer>
      <p data-i18n="popup_privacy"></p>
      <p class="muted" data-i18n="popup_limits"></p>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
